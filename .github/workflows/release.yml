name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publier-l-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Le tag porte la version du manifeste
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run ci:check
      - run: npm pack
      - name: Attacher l'archive à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" portfolio-2025-partage-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
